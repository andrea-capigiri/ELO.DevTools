<div class="home-container">
  <header class="header">
    <h1>Developer Tools</h1>
    <p>Strumenti utili per sviluppatori</p>
  </header>

  <div class="tools-grid">
    <mat-card *ngFor="let tool of tools" class="tool-card" routerLink="{{tool.route}}">
      <mat-card-header>
        <mat-icon mat-card-avatar>{{tool.icon}}</mat-icon>
        <mat-card-title>{{tool.title}}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{tool.description}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary">
          Apri
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
