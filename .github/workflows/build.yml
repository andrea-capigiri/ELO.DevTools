name: Angular Build & Package

on:
  pull_request:
    branches:
      - 'build/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [production-chrome, production-edge]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get project name and commit sha
        id: meta
        run: |
          echo "PROJECT=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "VERSION=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.configuration }})
        run: npm run build -- --configuration=${{ matrix.configuration }}

      - name: Package as zip
        id: package
        run: |
          PROJECT="${{ steps.meta.outputs.PROJECT }}"
          VERSION="${{ steps.meta.outputs.VERSION }}"
          CONFIG="${{ matrix.configuration }}"
          ZIP_NAME="${PROJECT}_${CONFIG}_${VERSION}.zip"

          # Cerca la cartella di output dentro dist/
          OUTPUT_DIR=$(find dist -maxdepth 1 -type d ! -path dist | head -1)

          zip -r "$ZIP_NAME" "$OUTPUT_DIR/"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ZIP_NAME }}
          path: ${{ steps.package.outputs.ZIP_NAME }}
          retention-days: 30
