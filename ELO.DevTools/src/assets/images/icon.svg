<svg viewBox="12 12 40 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="grad-grid-b-primary-80" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <mask id="cut-lines">
      <!-- Rettangolo espanso per non tagliare le linee scalate -->
      <rect x="-10" y="-10" width="100" height="100" fill="white" />
      
      <!-- Cardinali (R=14) -->
      <circle cx="32" cy="18" r="3" fill="black" />
      <circle cx="46" cy="32" r="3" fill="black" />
      <circle cx="32" cy="46" r="3" fill="black" />
      <circle cx="18" cy="32" r="3" fill="black" />
      
      <!-- Diagonali (Offset=11.5) -->
      <circle cx="43.5" cy="20.5" r="3" fill="black" />
      <circle cx="43.5" cy="43.5" r="3" fill="black" />
      <circle cx="20.5" cy="43.5" r="3" fill="black" />
      <circle cx="20.5" cy="20.5" r="3" fill="black" />
    </mask>
  </defs>

  <rect x="12" y="12" width="40" height="40" fill="url(#grad-grid-b-primary-80)" />

  <g stroke="#f8fafc" stroke-width="2" opacity="0.3" mask="url(#cut-lines)">
    <line x1="32" y1="32" x2="32" y2="18" />
    <line x1="32" y1="32" x2="46" y2="32" />
    <line x1="32" y1="32" x2="32" y2="46" />
    <line x1="32" y1="32" x2="18" y2="32" />
    
    <line x1="32" y1="32" x2="43.5" y2="20.5" />
    <line x1="32" y1="32" x2="43.5" y2="43.5" />
    <line x1="32" y1="32" x2="20.5" y2="43.5" />
    <line x1="32" y1="32" x2="20.5" y2="20.5" />
  </g>

  <g fill="#f8fafc" opacity="0.7">
    <circle cx="32" cy="18" r="3" />
    <circle cx="46" cy="32" r="3" />
    <circle cx="32" cy="46" r="3" />
    <circle cx="18" cy="32" r="3" />
    
    <circle cx="43.5" cy="20.5" r="3" />
    <circle cx="43.5" cy="43.5" r="3" />
    <circle cx="20.5" cy="43.5" r="3" />
    <circle cx="20.5" cy="20.5" r="3" />
  </g>

  <circle cx="32" cy="32" r="5" fill="#f8fafc" />
</svg>
