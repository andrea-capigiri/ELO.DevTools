<div class="home-container">
    <header class="header">
        <h1>ELO.DevTools</h1>
        <p>Strumenti utili per sviluppatori</p>
    </header>

    <div class="tools-grid">
        <ng-container *ngFor="let tool of tools">
            <div class="btn" routerLink="{{tool.route}}">
                {{tool.title}}
            </div>
        </ng-container>
    </div>
</div>
