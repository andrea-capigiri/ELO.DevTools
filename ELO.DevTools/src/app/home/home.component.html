<div class="home-container">
    <header class="home-header">
        <div class="header-row">
            <div>
                <h1 class="home-title">{{'app.title' | translate}}</h1>
                <p class="home-subtitle">Strumenti per sviluppatori</p>
            </div>
            <a class="settings-btn" routerLink="/settings">
                <mat-icon>settings</mat-icon>
            </a>
        </div>
    </header>

    <div class="tools-list">
        @for (tool of tools; track tool.route) {
            <a class="tool-card" [routerLink]="tool.route">
                <div class="tool-icon">
                    <mat-icon>{{tool.icon}}</mat-icon>
                </div>
                <div class="tool-info">
                    <div class="tool-title">{{tool.titleKey | translate}}</div>
                    <div class="tool-desc">{{tool.descriptionKey | translate}}</div>
                </div>
                <mat-icon class="tool-arrow">chevron_right</mat-icon>
            </a>
        }
    </div>
</div>
