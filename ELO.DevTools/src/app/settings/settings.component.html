<mat-toolbar color="primary">
    <button mat-icon-button routerLink="/">
        <mat-icon>arrow_back</mat-icon>
    </button>
    <span>Settings</span>
</mat-toolbar>

<div class="settings-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Enabled Tools</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <p class="settings-hint">Choose which tools to show in the home page.</p>
            <div class="tool-toggles">
                @for (tool of tools; track tool.id) {
                    <div class="tool-toggle-row">
                        <div class="tool-toggle-info">
                            <mat-icon class="tool-toggle-icon">{{tool.icon}}</mat-icon>
                            <span class="tool-toggle-title">{{tool.title}}</span>
                        </div>
                        <mat-slide-toggle
                            [checked]="tool.enabled"
                            (change)="onToggle(tool.id, $event.checked)">
                        </mat-slide-toggle>
                    </div>
                }
            </div>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button (click)="onEnableAll()">Enable All</button>
            <button mat-button (click)="onDisableAll()">Disable All</button>
            <button mat-button (click)="onResetDefaults()">Reset Defaults</button>
        </mat-card-actions>
    </mat-card>
</div>
