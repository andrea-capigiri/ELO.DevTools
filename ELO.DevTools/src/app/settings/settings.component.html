<p-toolbar>
    <ng-template #start>
        <p-button [text]="true" [rounded]="true" routerLink="/">
            <i class="material-icons">arrow_back</i>
        </p-button>
        <span class="toolbar-title">{{'settings.title' | translate}}</span>
    </ng-template>
</p-toolbar>

<div class="settings-container">
    <p-card styleClass="mb-2">
        <p-floatlabel variant="on">
            <p-select [options]="languages" [(ngModel)]="currentLanguage" optionLabel="label" optionValue="value" (onChange)="onLanguageChange($event.value)" styleClass="w-full" inputId="langSelect"></p-select>
            <label for="langSelect">{{'settings.language' | translate}}</label>
        </p-floatlabel>
    </p-card>

    <p-card [header]="'settings.enabledTools' | translate">
        <p class="settings-hint">{{'settings.chooseTools' | translate}}</p>
        <div class="tool-toggles">
            @for (tool of tools; track tool.id) {
                <div class="tool-toggle-row">
                    <div class="tool-toggle-info">
                        <i class="material-icons tool-toggle-icon">{{tool.icon}}</i>
                        <span class="tool-toggle-title">{{tool.titleKey | translate}}</span>
                    </div>
                    <p-toggleswitch
                        [(ngModel)]="tool.enabled"
                        (onChange)="onToggle(tool.id, $event.checked)">
                    </p-toggleswitch>
                </div>
            }
        </div>
        <ng-template #footer>
            <div class="card-footer">
                <p-button [text]="true" label="{{'settings.enableAll' | translate}}" (onClick)="onEnableAll()"></p-button>
                <p-button [text]="true" label="{{'settings.disableAll' | translate}}" (onClick)="onDisableAll()"></p-button>
                <p-button [text]="true" label="{{'settings.resetDefaults' | translate}}" (onClick)="onResetDefaults()"></p-button>
            </div>
        </ng-template>
    </p-card>
</div>
