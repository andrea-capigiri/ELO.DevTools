<mat-toolbar color="primary">
    <button mat-icon-button routerLink="/">
        <mat-icon>arrow_back</mat-icon>
    </button>
    <span>Base64 Encoder/Decoder</span>
</mat-toolbar>

<div class="tool-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Input</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <textarea matInput
                          placeholder="Enter text here..."
                          [(ngModel)]="inputText"
                          rows="8"></textarea>
            </mat-form-field>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="primary" (click)="onEncode()" [disabled]="!inputText.trim()">
                <mat-icon>lock</mat-icon>
                Encode
            </button>
            <button mat-raised-button color="primary" (click)="onDecode()" [disabled]="!inputText.trim()">
                <mat-icon>lock_open</mat-icon>
                Decode
            </button>
            <button mat-button (click)="onClear()" [disabled]="!inputText.trim() && !outputText.trim()">
                Clear
            </button>
        </mat-card-actions>
    </mat-card>

    <mat-card *ngIf="outputText">
        <mat-card-header>
            <mat-card-title>Output</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <textarea matInput
                          [readonly]="true"
                          [value]="outputText"
                          rows="8"></textarea>
            </mat-form-field>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button color="primary" (click)="onCopy()">
                <mat-icon>content_copy</mat-icon>
                Copy
            </button>
        </mat-card-actions>
    </mat-card>
</div>
