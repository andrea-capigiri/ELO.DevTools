<p-toolbar>
    <ng-template #start>
        <p-button [text]="true" [rounded]="true" routerLink="/">
            <i class="material-icons">arrow_back</i>
        </p-button>
        <span class="toolbar-title">URL Encoder/Decoder</span>
    </ng-template>
</p-toolbar>

<div class="tool-container">
    <p-card header="Input">
        <textarea pTextarea
                  placeholder="Enter text or URL here..."
                  [(ngModel)]="inputText"
                  rows="8"
                  class="w-full"></textarea>
        <ng-template #footer>
            <div class="card-footer">
                <p-button (onClick)="onEncode()" [disabled]="!inputText.trim()">
                    <i class="material-icons">link</i> Encode
                </p-button>
                <p-button (onClick)="onDecode()" [disabled]="!inputText.trim()">
                    <i class="material-icons">link_off</i> Decode
                </p-button>
                <p-button [text]="true" (onClick)="onClear()" label="Clear" [disabled]="!inputText.trim() && !outputText.trim()"></p-button>
            </div>
        </ng-template>
    </p-card>

    <p-card header="Output" *ngIf="outputText">
        <textarea pTextarea
                  [readonly]="true"
                  [value]="outputText"
                  rows="8"
                  class="w-full"></textarea>
        <ng-template #footer>
            <div class="card-footer">
                <p-button [text]="true" (onClick)="onCopy()">
                    <i class="material-icons">content_copy</i> Copy
                </p-button>
            </div>
        </ng-template>
    </p-card>
</div>
